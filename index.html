<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade 5 Unit 5 Town</title>

    <style>
      body {
        background-image: url("assets/halloween/background.png");
        background-size: cover;
        background-position: center;
        background-color: #002b36;
        color: #eee8d5;
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        text-align: center;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .page {
        background: #301934;
        padding: 30px;
        border: 4px solid #586e75;
        width: 90%;
        max-width: 800px;
      }
      .hidden {
        display: none !important;
      }

      #japanese-text {
        font-size: 30px;
        color: #b58900;
        margin-bottom: 5px;
        font-weight: bold;
      }
      #question-text {
        font-size: 50px;
        line-height: 1.1;
        margin: 10px 0;
        color: #fff;
      }

      /* Style para sa Question Image */
      #question-image {
        max-width: 250px;
        max-height: 180px;
        width: auto;
        height: auto;
        margin: 10px auto;
        border-radius: 8px;
        border: 2px solid #586e75;
        display: block;
      }

      /* Style para sa Text Hint */
      #hint-display {
        font-size: 1.5rem;
        color: #2aa198;
        background-color: #fada5f;
        padding: 8px 15px;
        border-radius: 6px;
        display: inline-block;
        margin: 10px 0;
        border: 1px dashed #2aa198;
      }

      #score-board {
        font-size: 1.5rem;
        color: #b58900;
        margin-bottom: 10px;
        font-weight: bold;
      }

      .chest-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
        justify-items: center;
      }
      .chest-btn {
        width: 120px;
        height: 120px;
        background-size: contain;
        background-repeat: no-repeat;
        border: none;
        cursor: pointer;
        background-color: transparent;
      }

      button {
        background: #268bd2;
        color: white;
        padding: 15px 30px;
        border: none;
        cursor: pointer;
        margin-top: 10px;
        font-size: 1.2rem;
        font-family: "Comic Sans MS", "Comic Sans", cursive;
      }

      .btn-hint {
        color: #002b36;
        background: #fada5f;
        margin-right: 10px;
      }

      .btn-quit {
        background: #dc322f;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div id="page-start" class="page">
      <h1 style="font-size: 60px">UNIT 5<br />STARTING OUT</h1>
      <button onclick="showPage('page-rules')">HOW TO PLAY</button><br />
      <button
        onclick="
          initGame('normal');
          showPage('page-quiz');
        "
      >
        PLAY</button
      ><br />
      <button
        style="background: #859900"
        onclick="
          initGame('extra');
          showPage('page-quiz');
        "
      >
        EXTRA CHALLENGE
      </button>
    </div>

    <div id="page-rules" class="page hidden">
      <h2>RULES</h2>
      <p>
        Answer correctly to open a chest! <br />正しく答えて、宝箱を開けよう！
      </p>
      <button onclick="showPage('page-start')">BACK</button>
    </div>

    <div id="page-quiz" class="page hidden">
      <div id="score-board">
        Question: <span id="q-current"></span> / <span id="q-total"></span>
      </div>

      <!-- Question Image (Nakalabas agad kung may image) -->
      <img id="question-image" class="hidden" alt="Question Image" />

      <div id="japanese-text"></div>
      <div id="question-text"></div>

      <!-- Lalabas dito ang Text Hint kapag clinic ang HINT button -->
      <div id="hint-display" class="hidden"></div>

      <div>
        <!-- Hint Button -->
        <button id="btn-hint" class="btn-hint" onclick="showHint()">
          💡 HINT
        </button>

        <!-- Reveal Answer Button -->
        <button id="btn-reveal" onclick="revealAnswer(false)">
          REVEAL ANSWER
        </button>
      </div>

      <div id="answer-section" class="hidden">
        <div>
          <h1
            id="answer-text"
            style="
              color: white;
              background-color: #009961;
              padding: 10px 20px;
              border-radius: 8px;
              display: inline-block;
              font-size: 2.4rem;
            "
          ></h1>
        </div>
        <button id="btn-win" onclick="showPage('page-chest')">
          CHOOSE A CHEST
        </button>
        <button id="btn-next" class="hidden" onclick="checkGameOver()">
          NEXT QUESTION
        </button>
      </div>
      <br /><button class="btn-quit" onclick="quitGame()">QUIT GAME</button>
    </div>

    <div id="page-chest" class="page hidden">
      <h2>CHOOSE A CHEST</h2>
      <div class="chest-grid">
        <button
          class="chest-btn"
          style="background-image: url(assets/halloween/orange.png)"
          onclick="win()"
        ></button>
        <button
          class="chest-btn"
          style="background-image: url(assets/halloween/purple.png)"
          onclick="win()"
        ></button>
        <button
          class="chest-btn"
          style="background-image: url(assets/halloween/yellow.png)"
          onclick="win()"
        ></button>
        <button
          class="chest-btn"
          style="background-image: url(assets/halloween/pink.png)"
          onclick="win()"
        ></button>
      </div>
    </div>

    <div id="page-reward" class="page hidden">
      <h2 id="win-text" style="font-size: 2.5rem">YOU WON!</h2>
      <div
        id="win-icon"
        style="
          width: 200px;
          height: 200px;
          background-size: contain;
          background-repeat: no-repeat;
          margin: 0 auto;
        "
      ></div>
      <p id="reward-desc" style="font-size: 1.5rem; margin: 20px"></p>
      <button onclick="checkGameOver()">NEXT QUESTION</button>
    </div>

    <div id="page-end" class="page hidden">
      <h1 id="end-title" style="font-size: 3rem">GAME OVER</h1>
      <p id="end-msg">Thanks for playing!</p>
      <button onclick="showPage('page-start')">RESTART</button>
    </div>

    <script>

        // "OCTOBER STUDENTS": {
        //   img: "october.png",

        // },
        // "NOVEMBER STUDENTS": {
        //   img: "november.png",
        //   desc: "Everyone sits down except those whose birthday starts in NOVEMBER <br>(誕生日が11月の人以外は、みんな座りましょう。)",
        // },
        // "DECEMBER STUDENTS": {
        //   img: "december.png",
        //   desc: "Everyone sits down except those whose birthday starts in DECEMBER <br>(誕生日が1２月の人以外は、みんな座りましょう。)",
        // },
      };

      let timer,
        timeLeft = "",
        currentQCount = 1,
        totalQuestions = 0,
        currentMode = "normal",
        currentPool = [],
        currentQuestion = null;

      function stopAllSounds() {
        [bgMusic, chestSound, tickSound, timeoutSound].forEach((s) => {
          s.pause();
          s.currentTime = 0;
        });
      }

      function initGame(mode, num) {
        currentMode = mode;
        totalQuestions = num || questions.length;
        currentQCount = 1;

        if (mode === "extra") {
          // Extra Challenge: Naka-randomize
          currentPool = [...questions].sort(() => Math.random() - 0.5);
        } else {
          // Normal Mode: Sunod-sunod (In-order). Ginamit natin ang reverse para magamit ang .pop()
          currentPool = [...questions].reverse();
        }

        document.getElementById("q-total").innerText = totalQuestions;
        document.getElementById("q-current").innerText = currentQCount;

        bgMusic.play().catch((e) => console.log("Music blocked:", e));
        loadQuestion();
      }

      function win() {
        chestSound.play().catch(() => {});
        const keys = Object.keys(rewards);
        const randomKey = keys[Math.floor(Math.random() * keys.length)];
        const reward = rewards[randomKey];

        document.getElementById("win-text").innerText = randomKey;
        document.getElementById("win-icon").style.backgroundImage =
          `url('assets/${reward.img}')`;
        document.getElementById("reward-desc").innerHTML = reward.desc;

        setTimeout(() => winSound.play().catch(() => {}), 500);
        showPage("page-reward");
      }

      function quitGame() {
        stopTimer();
        stopAllSounds();
        showPage("page-end");
      }

      function loadQuestion() {
        currentQuestion = currentPool.pop();
        if (!currentQuestion) {
          quitGame();
          return;
        }

        if (currentMode === "extra") {
          document.getElementById("japanese-text").innerText =
            currentQuestion.jExtra || "";
          document.getElementById("question-text").innerText =
            currentQuestion.qExtra || "";
          document.getElementById("answer-text").innerText =
            currentQuestion.aExtra || "";
        } else {
          document.getElementById("japanese-text").innerText =
            currentQuestion.j;
          document.getElementById("question-text").innerText =
            currentQuestion.qNormal;
          document.getElementById("answer-text").innerText =
            currentQuestion.aNormal;
        }

        // --- Kinokontrol ang Picture (Lalabas agad sa simula) ---
        const imgElement = document.getElementById("question-image");
        if (currentQuestion.img && currentQuestion.img.trim() !== "") {
          imgElement.src = currentQuestion.img;
          imgElement.classList.remove("hidden");
        } else {
          imgElement.src = "";
          imgElement.classList.add("hidden");
        }

        // --- I-reset ang Hint Text display ---
        const hintDisplay = document.getElementById("hint-display");
        const hintBtn = document.getElementById("btn-hint");
        hintDisplay.classList.add("hidden");
        hintDisplay.innerText = "";

        // Ipakita ang Hint Button kung may hintText sa data
        if (
          currentQuestion.hintText &&
          currentQuestion.hintText.trim() !== ""
        ) {
          hintBtn.classList.remove("hidden");
        } else {
          hintBtn.classList.add("hidden");
        }

        document.getElementById("btn-reveal").classList.remove("hidden");
        document.getElementById("answer-section").classList.add("hidden");
      }

      // Function para lumabas ang Text Hint kapag pinindot ang button
      function showHint() {
        const hintDisplay = document.getElementById("hint-display");
        if (currentQuestion && currentQuestion.hintText) {
          hintDisplay.innerText = "💡 Hint: " + currentQuestion.hintText;
          hintDisplay.classList.remove("hidden");
        }
        document.getElementById("btn-hint").classList.add("hidden");
      }

      function stopTimer() {
        clearInterval(timer);
      }

      function revealAnswer(isTimeout) {
        pauseMusic();
        if (!isTimeout) {
          revealSound.play().catch(() => {});
        }

        stopTimer();
        document.getElementById("btn-reveal").classList.add("hidden");
        document.getElementById("btn-hint").classList.add("hidden");
        document.getElementById("answer-section").classList.remove("hidden");

        const btnWin = document.getElementById("btn-win");
        const btnNext = document.getElementById("btn-next");

        if (isTimeout) {
          btnWin.classList.add("hidden");
          btnNext.classList.remove("hidden");
        } else {
          btnWin.classList.remove("hidden");
          btnNext.classList.add("hidden");
        }
      }

      function showPage(pageId) {
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.add("hidden"));
        document.getElementById(pageId).classList.remove("hidden");
      }

      function checkGameOver() {
        if (currentQCount >= totalQuestions) {
          quitGame();
        } else {
          currentQCount++;
          document.getElementById("q-current").innerText = currentQCount;
          loadQuestion();
          bgMusic.play().catch(() => {});
          showPage("page-quiz");
        }
      }

      function pauseMusic() {
        bgMusic.pause();
      }

      function resumeMusic() {
        bgMusic.play().catch(() => {});
      }
    </script>

</html>
